name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-suite:
    name: ${{ matrix.os }} / Bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux lint dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Install macOS lint dependencies
        if: runner.os == 'macOS'
        run: brew install jq shellcheck
      - name: Run the canonical local CI gate
        run: /bin/bash scripts/ci-local.sh --bash /bin/bash

  pinned-release-gate:
    name: Pinned release archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deterministic-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Build and test without publishing
        run: /bin/bash scripts/release.sh --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/orchid-release" --bash /bin/bash

